name: Deploy to GitHub Pages

on:
  push:
    branches: [ release ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run checks & Build
        run: npm run check
        env:
          # Base URL path for Vite build
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/euclid-in-motion/' }}

      - name: Deploy to External Repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAT }}
          external_repository: ${{ vars.TARGET_REPO || 'YOUR_USERNAME/YOUR_TARGET_REPO' }}
          publish_dir: ./dist
          publish_branch: master
          destination_dir: ${{ vars.DESTINATION_DIR || 'euclid-in-motion' }}
          keep_files: true
